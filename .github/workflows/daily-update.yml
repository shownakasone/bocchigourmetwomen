# 毎日、最新の動画を取り込み → お店を抽出 → 位置を補完して、変更があればコミットする
# コミットされると Cloudflare Pages が自動でサイトを作り直して公開します
name: daily-update

on:
  schedule:
    - cron: '30 10 * * *'   # 毎日 19:30（日本時間）。火・金 18時の更新を拾える時刻
  workflow_dispatch: {}      # GitHub の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm run build   # 壊れたデータを公開しないよう、ビルドが通るか確認
      - name: Commit changes
        run: |
          if git diff --quiet -- data; then echo "変更なし"; exit 0; fi
          git config user.name "bocchi-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
